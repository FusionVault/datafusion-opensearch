# datafusion-opensearch — a DataFusion TableProvider over OpenSearch (and Elasticsearch).
#
# Query an index as a DataFusion table: `SELECT … FROM idx WHERE …` is planned by DataFusion and
# executed as an OpenSearch `_search`, with the WHERE pushed into the query DSL, the projection into
# `_source`, and LIMIT into the page size; results stream page by page through a scroll cursor.
# Filters that cannot be translated exactly are left for DataFusion to apply, so partial pushdown is
# always correct. `CREATE EXTERNAL TABLE … STORED AS OPENSEARCH` and a schema provider that lists a
# cluster's indices make it reachable from SQL alone.
#
# Standalone and dependency-lean (datafusion, reqwest/rustls, serde_json). Package metadata is
# pinned here rather than inherited from a workspace so the crate publishes unchanged from its own
# repository.
[package]
name = "datafusion-opensearch"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "A DataFusion TableProvider over OpenSearch/Elasticsearch with filter, projection and limit pushdown."
repository = "https://github.com/FusionVault/datafusion-opensearch"
readme = "README.md"
documentation = "https://docs.rs/datafusion-opensearch"
keywords = ["datafusion", "opensearch", "elasticsearch", "arrow", "tableprovider"]
categories = ["database"]
# Repo tooling that has no place in the published crate.
exclude = [".github/", ".gitignore", "rustfmt.toml"]

[dependencies]
# Tracks the DataFusion major line; bump the major together with DataFusion.
datafusion = "54"
async-trait = "0.1"
futures = "0.3"
# rustls-only, JSON — no native TLS / openssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
snafu = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Integration tests run a real OpenSearch container (`cargo test -- --ignored`).
testcontainers = "0.27"

[features]
default = []
# Scalar UDFs that carry OpenSearch-native predicates (`match`, geo bounding box / distance /
# polygon) through the planner so the provider pushes them down as native queries.
udf = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Dev/test builds: line-tables-only debug info. The DataFusion dependency graph with full DWARF
# links to ~1 GB per test binary and exhausts CI runners (observed: `ld … signal 7 [Bus error]`
# linking the testcontainers test). file:line in panics/backtraces is kept; step-debugger locals
# are not — override locally with `debug = true` if you need them.
[profile.dev]
debug = "line-tables-only"
